<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Orders</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
</head>

<body>
    <div class="container my-4">
        <h3 class="mb-3">Order List</h3>
        <div class="mb-3">
            <a th:href="@{/ui/order/addnew}" class="btn btn-primary btn-sm">Create New Order</a>
            <a th:href="@{/ui/buyer}" class="btn btn-secondary btn-sm">Manage Buyers</a>
        </div>

        <table class="table table-striped table-bordered w-100">
            <thead class="thead-dark">
                <tr>
                    <th>Order Nr.</th>
                    <th>Buyer</th>
                    <th>Delivery Address</th>
                    <th>Items (Name x Qty)</th>
                    <th>Status</th>
                    <th>Total Amount</th>
                    <th>Currency</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${orderList.empty}">
                    <td colspan="8" class="text-center">No orders found.</td>
                </tr>
                <tr th:each="order : ${orderList}">
                    <td th:text="${order.orderNr}"></td>
                    <td
                        th:text="${order.buyer != null ? order.buyer.firstName + ' ' + order.buyer.lastName : 'Unknown Buyer'}">
                    </td>

                    <td>
                        <span th:if="${order.deliveryAddress != null}"
                            th:text="${order.deliveryAddress.street + ' ' + order.deliveryAddress.homeNumber + ', ' + order.deliveryAddress.city}">
                        </span>
                        <span th:if="${order.deliveryAddress == null}" class="text-muted">N/A</span>
                    </td>

                    <td>
                        <ul class="list-unstyled mb-0" th:if="${order.orderItems != null}">
                            <li th:each="item : ${order.orderItems}">
                                <small>
                                    <strong th:text="${item.name}">Artikl</strong>
                                    <span th:text="'(x' + ${item.quantity} + ')'"></span>
                                </small>
                            </li>
                        </ul>
                    </td>

                    <td>
                        <span class="badge badge-info" th:text="${order.orderStatus}">Status</span>
                    </td>
                    <td th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></td>
                    <td th:text="${order.currency}"></td>
                    <td>
                        <a th:href="@{/ui/order/deleteOrder/{id}(id=${order.orderNr})}" class="btn btn-sm btn-danger"
                            onclick="return confirm('Are you sure you want to delete this order?')">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
