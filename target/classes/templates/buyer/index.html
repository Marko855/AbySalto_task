<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Buyers</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
</head>
<body>
    <div class="container my-4">
        <h3>Buyer List</h3>
        <div class="mb-3">
            <a th:href="@{/ui/buyer/addnew}" class="btn btn-primary btn-sm">Add buyer</a>
            <a th:href="@{/ui/order}" class="btn btn-secondary btn-sm">Manage orders</a>
        </div>
        
        <table class="table table-striped table-bordered">
            <thead class="thead-dark">
                <tr>
                    <th>First name</th>
                    <th>Last name</th>
                    <th>Title</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${buyerList.empty}">
                    <td colspan="4" class="text-center">No buyers found.</td>
                </tr>
                <tr th:each="buyer : ${buyerList}">
                    <td th:text="${buyer.firstName}"></td>
                    <td th:text="${buyer.lastName}"></td>
                    <td th:text="${buyer.title}"></td>
                    <td> 
                        <a th:href="@{/ui/buyer/showFormForUpdate/{id}(id=${buyer.buyerId})}" class="btn btn-sm btn-primary">Update</a>
                        <a th:href="@{/ui/buyer/deleteBuyer/{id}(id=${buyer.buyerId})}" class="btn btn-sm btn-danger">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
